[project]
name = "ai-support-assistant"
version = "1.0.0"
requires-python = ">=3.12"
dependencies = ["fastapi==0.162.0", "uvicorn==0.54.0", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
